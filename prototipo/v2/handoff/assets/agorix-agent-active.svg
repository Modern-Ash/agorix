<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Agorix Agent active</title>
  <desc id="desc">Agorix code cursor and modular block surrounded by an active AI orbit.</desc>
  <defs>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"></stop>
      <stop offset="0.55" stop-color="#7C3AED"></stop>
      <stop offset="1" stop-color="#A855F7"></stop>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"></stop>
      <stop offset="1" stop-color="#A855F7"></stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#071426"></rect>
  <g fill="none" stroke="url(#orbit)" stroke-width="18" stroke-linecap="round" filter="url(#glow)">
    <path d="M105 117A202 202 0 0 1 386 99"></path>
    <path d="M414 139A202 202 0 0 1 407 377"></path>
    <path d="M368 411A202 202 0 0 1 132 407"></path>
    <path d="M91 367A202 202 0 0 1 77 166"></path>
  </g>
  <g fill="url(#orbit)" filter="url(#glow)">
    <circle cx="414" cy="104" r="10"></circle>
    <circle cx="439" cy="129" r="6"></circle>
    <circle cx="92" cy="400" r="8"></circle>
  </g>
  <g transform="translate(88 142)">
    <path d="M16 14 118 116 16 218" fill="none" stroke="#2F6FED" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M166 55h96v38h38v96h-38v38h-96z" fill="url(#block)" filter="url(#glow)"></path>
  </g>
  <circle cx="382" cy="190" r="13" fill="#A855F7" filter="url(#glow)"></circle>
</svg>