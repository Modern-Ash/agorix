name: Ori Integration CI

on:
  push:
    branches:
      - integration/ori
      - feature/ori-*
  pull_request:
    branches:
      - integration/ori

permissions:
  contents: read

concurrency:
  group: ori-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report Prettier debt by area (blocking)
        run: node scripts/report-formatting-debt.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  unit-tests:
    name: Full unit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke test actual compiled educator report CLI
        working-directory: apps/tutor-api
        run: node scripts/ori-educator-production-smoke.mjs
      - name: Five-scenario synthetic educator pilot smoke
        working-directory: apps/tutor-api
        run: node scripts/ori-educator-pilot-smoke.mjs

  ori-interoperability:
    name: Real Ori process interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Agorix integration branch / PR
        uses: actions/checkout@v4
        with:
          path: agorix
      - name: Verify Ori read credential configured
        env:
          ORI_READ_TOKEN: ${{ secrets.ORI_READ_TOKEN }}
        run: |
          if [ -z "$ORI_READ_TOKEN" ]; then
            echo "::error::Configure ORI_READ_TOKEN as a fine-grained read-only GitHub token with access to Modern-Ash/ori."
            exit 1
          fi
      - name: Checkout Ori main
        uses: actions/checkout@v4
        with:
          repository: Modern-Ash/ori
          ref: main
          path: ori
          token: ${{ secrets.ORI_READ_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: agorix/.nvmrc
          cache: pnpm
          cache-dependency-path: agorix/pnpm-lock.yaml
      - name: Install Agorix dependencies
        working-directory: agorix
        run: pnpm install --frozen-lockfile
      - name: Verify Ori server is present
        run: test -f ori/examples/shadow-api/serve.mjs && test -f ori/src/shadow-plan.mjs
      - name: Execute actual cross-repository process test (no skip)
        working-directory: agorix
        env:
          ORI_REPO_PATH: ${{ github.workspace }}/ori
          ORI_PARITY_REPORT_DIR: ${{ github.workspace }}/ori-parity-artifacts
        run: |
          pnpm test:ori:interop
          pnpm test:ori:runtime
      - name: Require real Ori process to authenticated HTTP and SQLite E2E
        working-directory: agorix
        env:
          ORI_REPO_PATH: ${{ github.workspace }}/ori
        run: pnpm exec vitest run apps/tutor-api/src/oriMig03RealProcessPresentationE2E.test.ts
      - name: Upload synthetic Ori mission parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ori-mig03-mission-parity
          path: ori-parity-artifacts/ori-mig03-mission-matrix.json
          if-no-files-found: warn
          retention-days: 14

  ori-learner-browser:
    name: Ori learner Playwright journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agorix/web exec playwright install --with-deps chromium
      - name: Run feature-flagged Ori learner journeys
        working-directory: apps/web
        run: pnpm test:e2e:ori
