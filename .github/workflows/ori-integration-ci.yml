name: Ori Integration CI

on:
  push:
    branches:
      - integration/ori
      - feature/ori-*
  pull_request:
    branches:
      - integration/ori

permissions:
  contents: read

concurrency:
  group: ori-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  unit-tests:
    name: Full unit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  ori-interoperability:
    name: Real Ori process interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Agorix integration branch / PR
        uses: actions/checkout@v4
        with:
          path: agorix
      - name: Verify Ori read credential configured
        env:
          ORI_READ_TOKEN: ${{ secrets.ORI_READ_TOKEN }}
        run: |
          if [ -z "$ORI_READ_TOKEN" ]; then
            echo "::error::Configure ORI_READ_TOKEN as a fine-grained read-only GitHub token with access to Modern-Ash/ori."
            exit 1
          fi
      - name: Checkout Ori main
        uses: actions/checkout@v4
        with:
          repository: Modern-Ash/ori
          ref: main
          path: ori
          token: ${{ secrets.ORI_READ_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: agorix/.nvmrc
          cache: pnpm
          cache-dependency-path: agorix/pnpm-lock.yaml
      - name: Install Agorix dependencies
        working-directory: agorix
        run: pnpm install --frozen-lockfile
      - name: Verify Ori server is present
        run: test -f ori/examples/shadow-api/serve.mjs && test -f ori/src/shadow-plan.mjs
      - name: Execute actual cross-repository process test (no skip)
        working-directory: agorix
        env:
          ORI_REPO_PATH: ${{ github.workspace }}/ori
        run: pnpm test:ori:interop
