name: Ori Integration CI

on:
  push:
    branches:
      - integration/ori
      - feature/ori-*
  pull_request:
    branches:
      - integration/ori

permissions:
  contents: read

concurrency:
  group: ori-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ori integration quality and regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Full unit and regression suite
        run: pnpm test
      - name: Build
        run: pnpm build

  ori-interoperability:
    name: Real Ori process interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Agorix integration branch / PR
        uses: actions/checkout@v4
        with:
          path: agorix
      - name: Checkout Ori main
        uses: actions/checkout@v4
        with:
          repository: Modern-Ash/ori
          ref: main
          path: ori
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: agorix/.nvmrc
          cache: pnpm
          cache-dependency-path: agorix/pnpm-lock.yaml
      - name: Install Agorix dependencies
        working-directory: agorix
        run: pnpm install --frozen-lockfile
      - name: Verify Ori server is present
        run: test -f ori/examples/shadow-api/serve.mjs && test -f ori/src/shadow-plan.mjs
      - name: Execute actual cross-repository process test (no skip)
        working-directory: agorix
        env:
          ORI_REPO_PATH: ${{ github.workspace }}/ori
        run: pnpm test:ori:interop
