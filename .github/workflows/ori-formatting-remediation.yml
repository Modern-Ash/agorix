name: Ori Formatting Remediation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ori-formatting-remediation
  cancel-in-progress: false

jobs:
  propose-formatting:
    name: Propose mechanical Prettier cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/ori
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier configuration
        run: pnpm format
      - name: Verify formatting is clean
        run: pnpm format:check
      - name: Create cleanup PR if files changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/ori-prettier-baseline-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -u
          git commit -m "style: normalize Ori integration formatting baseline"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base integration/ori --head "$branch" \
            --title "style: normalize Ori integration Prettier baseline" \
            --body "Mechanical formatting only, generated by pnpm format. No functional changes intended. Review diff and run all CI checks before merging. Addresses existing formatting debt."
