name: Ori MIG-04 P0 one-shot CI correction
on:
  push:
    branches:
      - feat/ori-mig04-p0-consolidated-close
    paths:
      - .github/workflows/ori-mig04-p0-fix-once.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL test dependency and update lockfile
        run: pnpm --filter @agorix/tutor-api add -D pg @types/pg
      - name: Format all five reported files
        run: |
          pnpm exec prettier --write \
            apps/tutor-api/src/oriMig04PgHostWiring.test.ts \
            apps/tutor-api/src/oriMig04PgPolicyAdmin.test.ts \
            apps/tutor-api/src/oriMig04PgPolicyAdmin.ts \
            apps/tutor-api/src/oriMig04PgRealDatabase.test.ts \
            apps/tutor-api/src/oriMig04PgRevocationIntegration.test.ts
      - name: Validate TypeScript and formatting
        run: |
          pnpm exec tsc --noEmit
          node scripts/report-formatting-debt.mjs
      - name: Commit corrections and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ori-mig04-p0-fix-once.yml
          git add apps/tutor-api/package.json pnpm-lock.yaml apps/tutor-api/src
          git commit -m "fix(ori): install PostgreSQL test driver and format MIG-04 suite"
          git push origin HEAD:feat/ori-mig04-p0-consolidated-close
