name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.9

jobs:
  lockfile-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agorix_test
          POSTGRES_USER: agorix_test
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agorix_test -d agorix_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agorix/server test -- postgres.test.ts
        env:
          AGORIX_TEST_POSTGRES_URL: postgresql://agorix_test:local-test-only@127.0.0.1:5432/agorix_test
      - run: pnpm exec vitest run apps/tutor-api/src/oriMig04PostgresIntegration.test.ts
        env:
          AGORIX_TEST_POSTGRES_URL: postgresql://agorix_test:local-test-only@127.0.0.1:5432/agorix_test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  boundary-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint packages --max-warnings=0

  browser-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @agorix/web test:e2e
      # A failed visual comparison is only useful with the actual and diff images.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  # The production specs (apps/web/e2e/prod) only ran after a deploy, and broke it twice when a flow
  # changed. Run them here against the same nginx image the deploy builds, on loopback (#1220).
  prod-smoke-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the production image
        run: |
          SHA12="$(git rev-parse HEAD | cut -c1-12)"
          echo "SHA12=$SHA12" >> "$GITHUB_ENV"
          docker build -f deploy/web/Dockerfile --build-arg GIT_SHA="$SHA12" -t agorix-web:ci .
      - name: Serve it on loopback
        run: |
          docker run -d --name agorix-web -p 127.0.0.1:8470:80 agorix-web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8470/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8470/version.json
      - run: pnpm --filter @agorix/web exec playwright install --with-deps chromium
      - name: Production specs against the local image
        # Account linking is off in this build (no project service behind nginx), as in a default deploy.
        run: pnpm --filter @agorix/web test:prod
        env:
          AGORIX_E2E_BASE_URL: http://127.0.0.1:8470
          AGORIX_EXPECT_SHA: ${{ env.SHA12 }}
          AGORIX_EXPECT_ADULT_LINK: "0"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prod-smoke-local-results
          path: apps/web/test-results
          retention-days: 7

  # Children use tablets, so Safari's engine matters: run the child's journeys in WebKit too (#1220).
  browser-smoke-webkit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @agorix/web exec playwright test --project=webkit
        env:
          AGORIX_E2E_WEBKIT: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-webkit-results
          path: apps/web/test-results
          retention-days: 7

  vscode-extension-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (engines.vscode) and latest stable.
        vscode: ["1.95.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter agorix-studio package
      - name: Extension Host integration tests (development folder)
        run: xvfb-run -a pnpm --filter agorix-studio test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - name: Install VSIX into a clean profile and smoke test it
        run: xvfb-run -a pnpm --filter agorix-studio test:vsix
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - uses: actions/upload-artifact@v4
        if: matrix.vscode == 'stable'
        with:
          name: agorix-studio-vsix
          path: extensions/vscode/dist/agorix-studio.vsix

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm security:check

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm verify
