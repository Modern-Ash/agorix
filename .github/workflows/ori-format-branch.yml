name: Format Ori integration branch (temporary)
on:
  push:
    branches:
      - feature/ori-integration-ci
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Modern-Ash/agorix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/tutor-api/src scripts/verify-ori-interop.mjs docs/architecture
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/tutor-api/src scripts/verify-ori-interop.mjs docs/architecture
            git commit -m "style: format Ori integration files"
            git push
          fi
