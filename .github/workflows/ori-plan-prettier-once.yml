name: Format Ori plan files (one-time)
on:
  push:
    branches:
      - fix/ori-plan-prettier
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/tutor-api/src/oriPlanConsumer.ts apps/tutor-api/src/oriPlanConsumer.test.ts
      - name: Commit only formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/tutor-api/src/oriPlanConsumer.ts apps/tutor-api/src/oriPlanConsumer.test.ts
            git commit -m "style: apply repository Prettier to Ori plan consumer"
            git push
          fi
