<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Static-host fallback for hosts that ignore public/_headers.
      Mirrors apps/web/src/securityHeaders.ts (frame-ancestors cannot be expressed
      via meta and remains a response-header requirement). Keep in sync; the
      securityHeaders test enforces it. See docs/safety/WEB_SECURITY_BASELINE.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.v2.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.v2.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/agorix-mark-180.png" />
    <meta name="theme-color" content="#06923e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Agorix" />
    <meta
      name="description"
      content="Agorix: un estudio de programación con bloques y código visible para que chicos y chicas aprendan creando, con una IA que propone y ellos deciden."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agorix" />
    <meta property="og:title" content="Agorix: programá creando" />
    <meta
      property="og:description"
      content="Bloques y código visible, mundos para explorar y una IA que propone mientras vos decidís."
    />
    <meta property="og:url" content="https://agorix.modern-ash.com/" />
    <meta
      property="og:image"
      content="https://agorix.modern-ash.com/brand/agorix-share-1200x630.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Agorix Kids: programá creando" />
    <meta property="og:locale" content="es_AR" />
    <title>Agorix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
