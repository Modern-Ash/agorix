<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Static-host fallback for hosts that ignore public/_headers.
      Mirrors apps/web/src/securityHeaders.ts (frame-ancestors cannot be expressed
      via meta and remains a response-header requirement). Keep in sync; the
      securityHeaders test enforces it. See docs/safety/WEB_SECURITY_BASELINE.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.v2.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.v2.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/agorix-mark.v2.svg" />
    <meta name="theme-color" content="#06923e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Agorix" />
    <title>Agorix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
