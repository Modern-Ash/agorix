<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mapa (celular)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:#1B2333}
a{color:#0F6E66}a:hover{color:#0A4F49}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #EEF2F7; font-family: Nunito, system-ui, sans-serif; color: #1B2333; overflow: hidden">
  <header style="padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px; background: #FFFFFF">
    <div style="width: 44px; height: 44px; border-radius: 22px; background: #F5B301; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px">L</div>
    <div style="display: flex; flex-direction: column; flex-grow: 1">
      <h1 style="margin: 0; font-weight: 900; font-size: 22px">Mapa</h1>
      <span style="font-size: 13px; color: #5B6475; font-weight: 700">1 estrella · 1 de 12 misiones</span>
    </div>
    <button aria-label="Escuchar" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D5DAE3; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
    </button>
  </header>

  <sc-if value="{{showBanner}}" hint-placeholder-val="{{true}}">
  <div role="status" style="margin: 10px 16px 0; padding: 10px 12px; border-radius: 14px; background: #FFF6D6; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700">
    <span style="flex-grow: 1">Un adulto puede elegir tu edad para ajustar el juego.</span>
    <button aria-label="Cerrar aviso" onClick="{{closeBanner}}" style="width: 36px; height: 36px; border-radius: 10px; border: 0; background: transparent; font-size: 20px; cursor: pointer">×</button>
  </div>
  </sc-if>

  <div role="tablist" aria-label="Mundos" style="margin: 12px 16px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{worlds}}" as="w" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{w.on}}" onClick="{{w.pick}}" style="height: 86px; border-radius: 16px; border: 2.5px solid {{w.border}}; background: {{w.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
        <span style="width: 32px; height: 32px; border-radius: 10px; background: {{w.color}}"></span>
        <span style="font-size: 14px; font-weight: 900; color: #1B2333">{{w.label}}</span>
        <span style="font-size: 12px; font-weight: 700; color: #5B6475">{{w.prog}}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin: 12px 16px 0; display: flex; gap: 6px">
    <span style="padding: 6px 12px; border-radius: 999px; background: #E6EEFD; color: #1D4FC4; font-size: 13px; font-weight: 800">Secuencia</span>
    <span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; color: #5B6475; font-size: 13px; font-weight: 800">Giros</span>
    <span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; color: #5B6475; font-size: 13px; font-weight: 800">Repetición</span>
  </div>

  <main style="flex-grow: 1; margin: 12px 16px 0; border-radius: 22px; background: {{worldBg}}; position: relative; overflow: hidden; padding: 18px; transition: background 0.3s">
    <h2 style="margin: 0; font-size: 20px; font-weight: 900; color: #FFFFFF">{{worldName}}</h2>
    <svg style="position: absolute; left: 0; top: 0" width="358" height="420" viewBox="0 0 358 420" aria-hidden="true"><path d="M90 340 C 220 320, 260 260, 200 210 S 110 120, 250 80" fill="none" stroke="#5A6A94" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"></path></svg>
    <div style="position: absolute; left: 50px; top: 290px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="width: 72px; height: 72px; border-radius: 36px; background: #F5B301; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; box-shadow: 0 5px 0 #C08C00">1</div>
      <span style="padding: 3px 10px; border-radius: 10px; background: #FFFFFF; font-size: 13px; font-weight: 800">Camino recto ★</span>
    </div>
    <div style="position: absolute; left: 160px; top: 170px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <a href="EditorCelular.dc.html" style="width: 84px; height: 84px; border-radius: 42px; background: #FFFFFF; border: 5px solid #F5B301; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #1B2333; box-sizing: border-box">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#1B2333" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>
      </a>
      <span style="padding: 3px 10px; border-radius: 10px; background: #FFFFFF; font-size: 13px; font-weight: 800">2 · La esquina</span>
    </div>
    <div style="position: absolute; left: 215px; top: 44px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="width: 64px; height: 64px; border-radius: 32px; background: #3A4870; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9D2EA" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      </div>
      <span style="padding: 3px 10px; border-radius: 10px; background: #3A4870; color: #E4E9F5; font-size: 13px; font-weight: 800">3 · El zigzag</span>
    </div>
  </main>

  <nav aria-label="Principal" style="height: 80px; flex-shrink: 0; margin-top: 12px; background: #FFFFFF; border-top: 1px solid #E2E6EE; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <sc-if value="{{n.isOri}}" hint-placeholder-val="{{false}}">
        <button aria-label="Hablar con Ori" style="justify-self: center; width: 60px; height: 60px; margin-top: -26px; border-radius: 30px; border: 4px solid #FFFFFF; background: #6D3FE0; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 6px 14px rgba(77, 42, 168, 0.3); cursor: pointer"><span style="width: 7px; height: 11px; border-radius: 4px; background: #FFFFFF"></span><span style="width: 7px; height: 11px; border-radius: 4px; background: #FFFFFF"></span></button>
      </sc-if>
      <sc-if value="{{n.isLink}}" hint-placeholder-val="{{true}}">
        <a href="{{n.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 100%; text-decoration: none; color: {{n.color}}; font-size: 12px; font-weight: 800">
          <span style="width: 24px; height: 5px; border-radius: 3px; background: {{n.dot}}"></span>{{n.label}}
        </a>
      </sc-if>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var w0 = st.w || 0;
    var ws = [['Espacio', '#1E2A4A', '1/3'], ['Océano', '#0E7490', '0/3'], ['Robots', '#5B6475', '0/3'], ['Ciudad', '#C2410C', '0/3']];
    var deep = ['#1E2A4A', '#0B4F63', '#2E3646', '#7A2A0B'];
    var nv = [['Mapa', '#', 0], ['Crear', 'CrearCelular.dc.html', 0], ['Ori', '', 1], ['Proyectos', '#', 0], ['Adultos', 'Main.dc.html', 0]];
    return {
      showBanner: !st.closed,
      closeBanner: function () { self.setState({ closed: true }); },
      worldName: ws[w0][0],
      worldBg: deep[w0],
      worlds: ws.map(function (w, i) { var a = i === w0; return { label: w[0], color: w[1], prog: w[2], on: a ? 'true' : 'false', border: a ? '#F5B301' : '#E2E6EE', bg: a ? '#FFFBEB' : '#FFFFFF', pick: function () { self.setState({ w: i }); } }; }),
      nav: nv.map(function (n, i) { var a = i === 0; return { label: n[0], href: n[1], isOri: n[2] === 1, isLink: n[2] !== 1, color: a ? '#0A4F49' : '#5B6475', dot: a ? '#0F6E66' : 'transparent' }; })
    };
  }
}
</script>
</body>
</html>
