<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor con bloques abiertos (celular)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:#1B2333}
a{color:#0F6E66}a:hover{color:#0A4F49}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #EEF2F7; font-family: Nunito, system-ui, sans-serif; color: #1B2333; overflow: hidden; position: relative">
  <header style="height: 60px; flex-shrink: 0; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #E2E6EE">
    <a href="#" aria-label="Volver a Crear" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D5DAE3; display: flex; align-items: center; justify-content: center; color: #1B2333">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-weight: 900; font-size: 19px; flex-grow: 1">Escena libre</h1>
    <button aria-label="Deshacer" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D5DAE3; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
    </button>
    <button aria-label="Más opciones" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D5DAE3; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
      <span style="width: 4px; height: 4px; border-radius: 2px; background: #1B2333"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: #1B2333"></span><span style="width: 4px; height: 4px; border-radius: 2px; background: #1B2333"></span>
    </button>
  </header>

  <div style="padding: 10px 12px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="height: 196px; border-radius: 18px; background: #CFEBDF; position: relative; overflow: hidden; border: 1px solid #B8DCCB">
      <div style="position: absolute; right: 30px; top: 20px; width: 36px; height: 36px; border-radius: 18px; background: #FCEFB4"></div>
      <div style="position: absolute; left: -60px; bottom: -100px; width: 280px; height: 180px; border-radius: 50%; background: #8CC9A6"></div>
      <div style="position: absolute; right: -70px; bottom: -110px; width: 300px; height: 190px; border-radius: 50%; background: #6BB48C"></div>
      <svg style="position: absolute; left: 200px; top: 64px" width="56" height="84" viewBox="0 0 80 120" aria-hidden="true"><path d="M40 0L72 46H56L78 80H2L24 46H8Z" fill="#2E8B57"></path><rect x="34" y="80" width="12" height="26" fill="#7A5230"></rect></svg>
      <sc-if value="{{showHola}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; left: {{bubbleX}}px; top: 68px; padding: 4px 10px; border-radius: 10px; background: #FFFFFF; font-weight: 800; font-size: 13px">¡Hola!</div>
      </sc-if>
      <div style="position: absolute; left: {{lumaX}}px; top: 104px; width: 46px; height: 46px; border-radius: 23px; background: #0F6E66; border: 3px solid #FFFFFF; transition: left 0.8s ease; display: flex; align-items: center; justify-content: center; gap: 6px"><span style="width: 6px; height: 9px; border-radius: 3px; background: #FFFFFF"></span><span style="width: 6px; height: 9px; border-radius: 3px; background: #FFFFFF"></span></div>
      <button aria-label="Achicar escenario" style="position: absolute; right: 8px; bottom: 8px; width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, 0.9); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2333" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 8px">
      <button onClick="{{play}}" style="flex-grow: 1; height: 52px; border: 0; border-radius: 14px; background: #F5B301; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 0 #C08C00; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1B2333" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>Jugar
      </button>
      <button onClick="{{stepFn}}" style="width: 72px; height: 52px; border: 1px solid #D5DAE3; border-radius: 14px; background: #FFFFFF; font-size: 15px; font-weight: 800; cursor: pointer">Paso</button>
      <button aria-label="Volver al inicio" onClick="{{reset}}" style="width: 52px; height: 52px; border: 1px solid #D5DAE3; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
      </button>
    </div>
    <div style="border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E6EE; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; height: 380px; box-sizing: border-box; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 12px; border-radius: 14px 14px 10px 10px; background: #F5B301; font-size: 15px; font-weight: 900">Cuando <span style="padding: 1px 8px; border-radius: 7px; background: #FFFFFF; font-size: 13px">al jugar</span></div>
      <sc-for list="{{program}}" as="p" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; margin: 3px 0 0 10px; border-radius: 10px; background: {{p.bg}}; color: #FFFFFF; font-size: 14px; font-weight: 800">{{p.label}}<sc-if value="{{p.hasVal}}" hint-placeholder-val="{{true}}"><span style="padding: 1px 8px; border-radius: 7px; background: #FFFFFF; color: {{p.dark}}">{{p.val}}</span></sc-if></div>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{sheetClosed}}" hint-placeholder-val="{{false}}">
    <button onClick="{{openSheet}}" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 56px; border: 0; border-radius: 16px; background: #1B2333; color: #FFFFFF; font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 16px rgba(27, 35, 51, 0.25); cursor: pointer">
      <span style="font-size: 22px; line-height: 1">+</span>Agregar bloques
    </button>
  </sc-if>
  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{true}}">
  <button aria-label="Cerrar bloques" onClick="{{closeSheet}}" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; border: 0; background: rgba(27, 35, 51, 0.18); cursor: pointer"></button>
  <section role="dialog" aria-label="Bloques" style="position: absolute; left: 0; right: 0; bottom: 0; height: 410px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(27, 35, 51, 0.15); display: flex; flex-direction: column">
    <button aria-label="Cerrar bloques" onClick="{{closeSheet}}" style="display: flex; justify-content: center; padding: 10px 0 4px; border: 0; background: transparent; cursor: pointer"><span style="width: 44px; height: 5px; border-radius: 3px; background: #C9CFDA"></span></button>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); padding: 4px 8px 10px; border-bottom: 1px solid #EEF1F5">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <button role="tab" aria-selected="{{c.on}}" aria-label="{{c.label}}" onClick="{{c.pick}}" style="height: 56px; border: 0; border-radius: 12px; background: {{c.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
          <span style="width: 24px; height: 24px; border-radius: 12px; background: {{c.color}}"></span>
          <span style="font-size: 10px; font-weight: 800; color: #1B2333">{{c.label}}</span>
        </button>
      </sc-for>
    </div>
    <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 16px; font-weight: 900; color: {{catDark}}">{{catName}} · tocá para agregar</span>
      <sc-for list="{{blocks}}" as="b" hint-placeholder-count="5">
        <button onClick="{{b.add}}" style="display: flex; align-items: center; justify-content: space-between; height: 50px; padding: 0 14px; border: 0; border-radius: 12px; background: {{b.bg}}; color: #FFFFFF; font-size: 16px; font-weight: 800; box-shadow: 0 3px 0 {{b.dark}}; cursor: pointer">
          <span style="display: flex; align-items: center; gap: 8px">{{b.label}}<sc-if value="{{b.hasVal}}" hint-placeholder-val="{{false}}"><span style="padding: 1px 9px; border-radius: 7px; background: #FFFFFF; color: {{b.dark}}; font-size: 14px">{{b.val}}</span></sc-if></span>
          <span style="font-size: 22px; line-height: 1">+</span>
        </button>
      </sc-for>
    </div>
  </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var cats = [
      ['Mirar', '#6D3FE0'], ['Mover', '#2563EB'], ['Sonido', '#BE185D'], ['Control', '#F5B301'],
      ['Lápiz', '#15803D'], ['Música', '#C2410C'], ['Datos', '#0E7490'], ['Míos', '#5B6475']
    ];
    var self = this;
    var st = this.state || {};
    var cat = st.cat == null ? 1 : st.cat;
    var s = st.s || 0;
    var dark = ['#4A2AA8', '#1D4FC4', '#9D1550', '#6B4700', '#0F5F2C', '#9A3410', '#0B5A70', '#3A4354'];
    var names = ['Apariencia', 'Movimiento', 'Sonidos', 'Control', 'Lápiz', 'Música', 'Variables', 'Mis bloques'];
    var lists = [
      [['Decir', '¡Hola!'], ['Pensar', 'Mmm…'], ['Mostrar', ''], ['Esconder', ''], ['Esperar', '1 s']],
      [['Mover', '1'], ['Retroceder', '1'], ['Girar a la derecha', '90°'], ['Apuntar hacia', 'arriba'], ['Rebotar en el borde', '']],
      [['Sonar', 'Pop'], ['Sonar', 'Gato'], ['Sonar', 'Tada'], ['Detener sonidos', '']],
      [['Repetir', '3'], ['Esperar', '1 s'], ['Enviar mensaje', 'hola']],
      [['Bajar el lápiz', ''], ['Subir el lápiz', ''], ['Color del lápiz', 'azul']],
      [['Tocar nota', 'Do 4'], ['Tocar percusión', 'bombo'], ['Instrumento', 'piano']],
      [['Crear variable', '']],
      [['Crear bloque', '']]
    ];
    var base = [{ label: 'Mover', val: '2', c: 1 }, { label: 'Decir', val: '¡Hola!', c: 0 }];
    var prog = base.concat(st.extra || []);
    var bgOf = function (c) { return c === 3 ? '#8A5A00' : cats[c][1]; };
    return {
      catName: names[cat], catDark: dark[cat],
      cats: cats.map(function (c, i) { var a = i === cat; return { label: c[0], color: c[1], on: a ? 'true' : 'false', bg: a ? '#EEF2F7' : 'transparent', pick: function () { self.setState({ cat: i }); } }; }),
      blocks: lists[cat].map(function (b) { return { label: b[0], val: b[1], hasVal: b[1] !== '', bg: bgOf(cat), dark: dark[cat], add: function () { var ex = (st.extra || []).concat([{ label: b[0], val: b[1], c: cat }]).slice(-5); self.setState({ extra: ex, sheet: false }); } }; }),
      program: prog.map(function (p) { return { label: p.label, val: p.val, hasVal: p.val !== '', bg: bgOf(p.c), dark: dark[p.c] }; }),
      sheetOpen: st.sheet !== false,
      sheetClosed: st.sheet === false,
      openSheet: function () { self.setState({ sheet: true }); },
      closeSheet: function () { self.setState({ sheet: false }); },
      lumaX: s >= 1 ? 140 : 50,
      bubbleX: s >= 1 ? 172 : 82,
      showHola: s >= 2,
      play: function () { self.setState({ s: 0, sheet: false }); setTimeout(function () { self.setState({ s: 1 }); }, 50); setTimeout(function () { self.setState({ s: 2 }); }, 900); },
      stepFn: function () { self.setState({ s: Math.min(2, s + 1), sheet: false }); },
      reset: function () { self.setState({ s: 0, extra: [] }); }
    };
  }
}
</script>
</body>
</html>
