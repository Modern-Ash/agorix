<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor con selector de sonidos (tablet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:#1B2333}
a{color:#0F6E66}a:hover{color:#0A4F49}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1024px; height: 768px; display: flex; flex-direction: column; background: #EEF2F7; font-family: Nunito, system-ui, sans-serif; color: #1B2333; overflow: hidden">
  <header style="height: 64px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #E2E6EE; display: flex; align-items: center; gap: 10px; padding: 0 16px">
    <a href="#" aria-label="Volver a Crear" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #D5DAE3; display: flex; align-items: center; justify-content: center; color: #1B2333">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-weight: 900; font-size: 22px">Escena libre</h1>
    <div style="flex-grow: 1"></div>
    <button aria-label="Deshacer" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #D5DAE3; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
    </button>
    <button aria-label="Rehacer" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #D5DAE3; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 0 0 0 12h3"></path></svg>
    </button>
    <span style="padding: 6px 12px; border-radius: 999px; background: #E3F2F0; color: #0A4F49; font-size: 14px; font-weight: 800">6–8</span>
  </header>

  <div style="flex-grow: 1; display: flex; min-height: 0">
    <nav aria-label="Categorías de bloques" style="width: 80px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E2E6EE; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <button aria-pressed="{{c.on}}" style="width: 68px; padding: 7px 0; border: 0; border-radius: 12px; background: {{c.bg}}; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer">
          <span style="width: 28px; height: 28px; border-radius: 14px; background: {{c.color}}"></span>
          <span style="font-size: 12px; font-weight: 800">{{c.label}}</span>
        </button>
      </sc-for>
    </nav>

    <section aria-label="Elegir sonido" style="width: 340px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E2E6EE; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 18px; font-weight: 900; color: #9D1550">Elegí un sonido</h2>
        <span style="font-size: 13px; color: #5B6475; font-weight: 700">84 sonidos</span>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #D5DAE3; background: #FAFBFD">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6475" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input placeholder="Buscar: gato, tren, magia…" aria-label="Buscar sonido" style="border: 0; background: transparent; font-size: 15px; outline: none; flex-grow: 1">
      </label>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
          <button aria-pressed="{{g.on}}" onClick="{{g.pick}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid {{g.border}}; background: {{g.bg}}; color: {{g.color}}; font-size: 14px; font-weight: 800; cursor: pointer">{{g.label}}</button>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{sounds}}" as="s" hint-placeholder-count="12">
          <button aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="height: 78px; border-radius: 14px; border: 2px solid {{s.border}}; background: {{s.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
            <span style="width: 30px; height: 30px; border-radius: 15px; background: #FCE7F1; display: flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#BE185D" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>
            </span>
            <span style="font-size: 14px; font-weight: 800; color: #1B2333">{{s.label}}</span>
          </button>
        </sc-for>
      </div>
      <button onClick="{{addSound}}" style="height: 50px; border: 0; border-radius: 14px; background: #BE185D; color: #FFFFFF; font-size: 16px; font-weight: 900; cursor: pointer">Agregar «Sonar {{soundName}}»</button>
    </section>

    <main style="flex-grow: 1; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0">
      <div style="height: 270px; border-radius: 18px; background: #CFEBDF; position: relative; overflow: hidden; border: 1px solid #B8DCCB">
        <div style="position: absolute; right: 40px; top: 26px; width: 44px; height: 44px; border-radius: 22px; background: #FCEFB4"></div>
        <div style="position: absolute; left: -60px; bottom: -110px; width: 360px; height: 210px; border-radius: 50%; background: #8CC9A6"></div>
        <div style="position: absolute; right: -80px; bottom: -130px; width: 380px; height: 220px; border-radius: 50%; background: #6BB48C"></div>
        <svg style="position: absolute; left: 290px; top: 100px" width="70" height="104" viewBox="0 0 80 120" aria-hidden="true"><path d="M40 0L72 46H56L78 80H2L24 46H8Z" fill="#2E8B57"></path><rect x="34" y="80" width="12" height="26" fill="#7A5230"></rect></svg>
        <sc-if value="{{showHola}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; left: {{bubbleX}}px; top: 98px; padding: 5px 11px; border-radius: 12px; background: #FFFFFF; font-weight: 800; font-size: 14px">¡Hola!</div>
        </sc-if>
        <div style="position: absolute; left: {{lumaX}}px; top: 140px; width: 54px; height: 54px; border-radius: 27px; background: #0F6E66; border: 3px solid #FFFFFF; transition: left 0.8s ease; display: flex; align-items: center; justify-content: center; gap: 8px"><span style="width: 7px; height: 11px; border-radius: 4px; background: #FFFFFF"></span><span style="width: 7px; height: 11px; border-radius: 4px; background: #FFFFFF"></span></div>
      </div>
      <div style="display: flex; gap: 8px">
        <button onClick="{{play}}" style="flex-grow: 1; height: 56px; border: 0; border-radius: 16px; background: #F5B301; font-size: 19px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 #C08C00; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1B2333" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>Jugar
        </button>
        <button onClick="{{stepFn}}" style="width: 84px; height: 56px; border: 1px solid #D5DAE3; border-radius: 16px; background: #FFFFFF; font-size: 16px; font-weight: 800; cursor: pointer">Paso</button>
        <button aria-label="Volver al inicio" onClick="{{reset}}" style="width: 56px; height: 56px; border: 1px solid #D5DAE3; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
        </button>
      </div>
      <div style="flex-grow: 1; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E6EE; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; position: relative">
        <span style="font-size: 15px; font-weight: 900; margin-bottom: 10px">Programa de Luma</span>
        <div style="display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 16px; border-radius: 18px 18px 12px 12px; background: #F5B301; font-size: 16px; font-weight: 900; box-shadow: 0 3px 0 #C08C00">Cuando <span style="padding: 2px 10px; border-radius: 8px; background: #FFFFFF; font-size: 14px">al jugar</span></div>
        <div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; margin: 4px 0 0 12px; border-radius: 12px; background: #2563EB; color: #FFFFFF; font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 #1A47B0">Mover <span style="padding: 2px 10px; border-radius: 8px; background: #FFFFFF; color: #1D4FC4">2</span></div>
        <div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; margin: 4px 0 0 12px; border-radius: 12px; background: #6D3FE0; color: #FFFFFF; font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 #4F2AB0">Decir <span style="padding: 2px 10px; border-radius: 8px; background: #FFFFFF; color: #4A2AA8">¡Hola!</span></div>
        <sc-for list="{{added}}" as="a" hint-placeholder-count="0">
          <div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; margin: 4px 0 0 12px; border-radius: 12px; background: #BE185D; color: #FFFFFF; font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 #9D1550">Sonar <span style="padding: 2px 10px; border-radius: 8px; background: #FFFFFF; color: #9D1550">{{a}}</span></div>
        </sc-for>
        <button aria-label="Pedirle una idea a Ori" style="position: absolute; right: 14px; bottom: 14px; width: 56px; height: 56px; border-radius: 28px; border: 0; background: #6D3FE0; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 6px 16px rgba(77, 42, 168, 0.3); cursor: pointer"><span style="width: 7px; height: 11px; border-radius: 4px; background: #FFFFFF"></span><span style="width: 7px; height: 11px; border-radius: 4px; background: #FFFFFF"></span></button>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    var cats = [
      ['Mirar', '#6D3FE0'], ['Mover', '#2563EB'], ['Sonido', '#BE185D'], ['Control', '#F5B301'],
      ['Lápiz', '#15803D'], ['Música', '#C2410C'], ['Datos', '#0E7490'], ['Míos', '#5B6475']
    ];
    var self = this;
    var st = this.state || {};
    var grp = st.grp || 0;
    var snd = st.snd || 0;
    var s = st.s || 0;
    var added = st.added || [];
    var gr = ['Animales', 'Transporte', 'Magia', 'Música', 'Efectos'];
    var sets = [
      ['Gato', 'Perro', 'Rana', 'Pato', 'Vaca', 'Búho', 'Ratón', 'Abeja', 'Caballo', 'Pájaro', 'Grillo', 'Pío'],
      ['Auto', 'Bocina', 'Tren', 'Avión', 'Barco', 'Bici', 'Cohete', 'Sirena', 'Motor'],
      ['Magia', 'Varita', 'Poción', 'Portal', 'Hechizo', 'Estrellita', 'Fantasma'],
      ['Piano', 'Flauta', 'Guitarra', 'Xilófono', 'Trompeta', 'Platillo', 'Redoblante', 'Tada'],
      ['Pop', 'Boom', 'Chispa', 'Zumbido', 'Clic', 'Ding', 'Moneda', 'Rebote', 'Aplauso']
    ];
    var list = sets[grp];
    var name = list[Math.min(snd, list.length - 1)];
    return {
      cats: cats.map(function (c, i) { var a = i === 2; return { label: c[0], color: c[1], on: a ? 'true' : 'false', bg: a ? '#FCE7F1' : 'transparent' }; }),
      groups: gr.map(function (g, i) { var a = i === grp; return { label: g, on: a ? 'true' : 'false', bg: a ? '#BE185D' : '#FFFFFF', color: a ? '#FFFFFF' : '#3A4354', border: a ? '#BE185D' : '#D5DAE3', pick: function () { self.setState({ grp: i, snd: 0 }); } }; }),
      sounds: list.map(function (x, i) { var a = i === snd; return { label: x, on: a ? 'true' : 'false', border: a ? '#BE185D' : '#E2E6EE', bg: a ? '#FDF2F7' : '#FFFFFF', pick: function () { self.setState({ snd: i }); } }; }),
      soundName: name,
      added: added,
      addSound: function () { if (added.length < 2) self.setState({ added: added.concat([name]) }); },
      lumaX: s >= 1 ? 170 : 60,
      bubbleX: s >= 1 ? 208 : 98,
      showHola: s >= 2,
      play: function () { self.setState({ s: 0 }); setTimeout(function () { self.setState({ s: 1 }); }, 50); setTimeout(function () { self.setState({ s: 2 }); }, 900); },
      stepFn: function () { self.setState({ s: Math.min(2, s + 1) }); },
      reset: function () { self.setState({ s: 0, added: [] }); }
    };
  }
}
</script>
</body>
</html>
