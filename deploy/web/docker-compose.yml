# Run from the repository root:
#   docker compose -f deploy/web/docker-compose.yml up -d --build
# Published on loopback only; the Cloudflare tunnel is the single ingress (#341).
name: agorix-web
services:
  web:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    # scripts/deploy-web.sh tags every build with the commit so a rollback is one `up -d`.
    image: agorix-web:${AGORIX_WEB_TAG:-local}
    container_name: agorix-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8470:80"
    volumes:
      # The host tutor process owns this socket. The Web can connect but cannot alter the directory.
      - type: bind
        source: ${AGORIX_TUTOR_SOCKET_DIR:?set AGORIX_TUTOR_SOCKET_DIR to the host tutor runtime directory}
        target: /run/agorix-tutor
        read_only: true
      # Reserved for the durable project server. It is empty until #347 activates the service.
      - type: bind
        source: ${AGORIX_PROJECT_SOCKET_DIR:?set AGORIX_PROJECT_SOCKET_DIR to the project runtime directory}
        target: /run/agorix-projects
        read_only: true
  projects:
    profiles: ["accounts"]
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile.projects
    image: agorix-projects:${AGORIX_PROJECT_TAG:-local}
    container_name: agorix-projects
    restart: unless-stopped
    environment:
      AGORIX_PROJECT_STORAGE: sqlite
      AGORIX_PROJECT_DB_PATH: /data/agorix.sqlite
      AGORIX_PROJECT_BACKUP_DIR: /backups
      AGORIX_PROJECT_SOCKET: /run/agorix-projects/projects.sock
      AGORIX_PROJECT_ORIGIN: ${AGORIX_PROJECT_ORIGIN-}
    volumes:
      - agorix-project-data:/data
      - agorix-project-backups:/backups
      - type: bind
        source: ${AGORIX_PROJECT_SOCKET_DIR:?set AGORIX_PROJECT_SOCKET_DIR to the project runtime directory}
        target: /run/agorix-projects

volumes:
  agorix-project-data:
  agorix-project-backups:
