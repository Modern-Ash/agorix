# Run from the repository root:
#   docker compose -f deploy/web/docker-compose.yml up -d --build
# Published on loopback only; the Cloudflare tunnel is the single ingress (#341).
name: agorix-web
services:
  web:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        VITE_KIDS_ADULT_LINK_DEFAULT: ${AGORIX_KIDS_ADULT_LINK_DEFAULT:-0}
    # scripts/deploy-web.sh tags every build with the commit so a rollback is one `up -d`.
    image: agorix-web:${AGORIX_WEB_TAG:-local}
    container_name: agorix-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8470:80"
    volumes:
      # The host tutor process owns this socket. The Web can connect but cannot alter the directory.
      - type: bind
        source: ${AGORIX_TUTOR_SOCKET_DIR:?set AGORIX_TUTOR_SOCKET_DIR to the host tutor runtime directory}
        target: /run/agorix-tutor
        read_only: true
      # Project socket appears when the separate accounts profile is activated.
      - type: bind
        source: ${AGORIX_PROJECT_SOCKET_DIR:?set AGORIX_PROJECT_SOCKET_DIR to the project runtime directory}
        target: /run/agorix-projects
        read_only: true
  projects:
    profiles: ["accounts"]
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile.projects
    image: agorix-projects:${AGORIX_PROJECT_TAG:-local}
    container_name: agorix-projects
    restart: unless-stopped
    environment:
      AGORIX_PROJECT_STORAGE: ${AGORIX_PROJECT_STORAGE:-sqlite}
      AGORIX_PROJECT_DB_PATH: /data/agorix.sqlite
      AGORIX_PROJECT_DATABASE_URL: ${AGORIX_PROJECT_DATABASE_URL-}
      AGORIX_PROJECT_BACKUP_DIR: /backups
      AGORIX_PROJECT_SOCKET: /run/agorix-projects/projects.sock
      AGORIX_PROJECT_ORIGIN: ${AGORIX_PROJECT_ORIGIN-}
      # Optional adult link (docs/architecture/PROJECT_HTTP_SERVER.md). Empty means off.
      AGORIX_LINK_SECRET: ${AGORIX_LINK_SECRET-}
      AGORIX_MAIL_SMTP_URL: ${AGORIX_MAIL_SMTP_URL-}
      AGORIX_MAIL_FROM: ${AGORIX_MAIL_FROM-}
      # Optional closed groups (ADR 0010); needs the adult link above. Empty means off.
      AGORIX_GROUP_SECRET: ${AGORIX_GROUP_SECRET-}
      # Where the project server reads the admin registry's public group limits
      # (an http(s) URL or unix:/absolute.sock). Empty keeps the code defaults.
      AGORIX_GROUP_CONFIG_URL: ${AGORIX_GROUP_CONFIG_URL-}
      AGORIX_PRIVATE_ADULT_PILOT: "1"
      # Optional private adult-account pilot. Never put an email in this tracked file.
      AGORIX_ALLOWED_ADULT_EMAIL: ${AGORIX_ALLOWED_ADULT_EMAIL-}
    volumes:
      - agorix-project-data:/data
      - agorix-project-backups:/backups
      - type: bind
        source: ${AGORIX_PROJECT_SOCKET_DIR:?set AGORIX_PROJECT_SOCKET_DIR to the project runtime directory}
        target: /run/agorix-projects
  postgres:
    profiles: ["postgresql"]
    image: postgres:17-alpine
    container_name: agorix-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGORIX_POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: agorix
      POSTGRES_USER: agorix
      POSTGRES_PASSWORD_FILE: /run/secrets/agorix-postgres-password
    volumes:
      - agorix-postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${AGORIX_POSTGRES_PASSWORD_FILE:-/run/secrets/agorix-postgres-password}
        target: /run/secrets/agorix-postgres-password
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agorix -d agorix"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  agorix-project-data:
  agorix-project-backups:
  agorix-postgres-data:
