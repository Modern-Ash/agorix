server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;

    # Development backend is never part of the production image.
    location ^~ /__dev/ {
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The app shell and the service worker must always revalidate so a deploy
    # reaches learners immediately.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /version.json {
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Optional tutor API (issue #348). The upstream is resolved lazily so nginx starts without
    # it; when it is absent the health call answers "not configured" (normal local mode).
    location = /api/tutor/health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $tutor_upstream http://tutor:8471;
        proxy_pass $tutor_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @tutor_off;
        include /etc/nginx/security-headers.conf;
    }

    location ^~ /api/tutor/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $tutor_upstream http://tutor:8471;
        proxy_pass $tutor_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        client_max_body_size 64k;
        include /etc/nginx/security-headers.conf;
    }

    location @tutor_off {
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 '{"configured":false,"available":false}';
    }

    # Hashed build output.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
