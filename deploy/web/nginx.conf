upstream agorix_tutor {
    server unix:/run/agorix-tutor/tutor.sock;
}

upstream agorix_projects {
    server unix:/run/agorix-projects/projects.sock;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;

    # Development backend is never part of the production image.
    location ^~ /__dev/ {
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The app shell and the service worker must always revalidate so a deploy
    # reaches learners immediately.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /version.json {
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The host tutor service owns this socket. nginx starts normally when the service is absent.
    location = /api/tutor/health {
        proxy_pass http://agorix_tutor;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @tutor_off;
        include /etc/nginx/security-headers.conf;
    }

    location ^~ /api/tutor/ {
        proxy_pass http://agorix_tutor;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        # The CLI has a 7s hard limit; allow its validated response through.
        proxy_read_timeout 9s;
        client_max_body_size 64k;
        include /etc/nginx/security-headers.conf;
    }

    location @tutor_off {
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 '{"configured":false,"available":false}';
    }

    # The project service is activated only after durable storage is available (#347).
    # Until then, account discovery gets JSON 404 instead of the SPA shell.
    location ^~ /v1/ {
        proxy_pass http://agorix_projects;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        client_max_body_size 1088k;
        proxy_intercept_errors on;
        error_page 502 504 = @projects_off;
        include /etc/nginx/security-headers.conf;
    }

    location @projects_off {
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Not found","retryable":false}}';
    }

    # Hashed build output.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
